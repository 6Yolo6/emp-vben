# Redis 7.0 配置文件 - EMP Platform

# 网络配置
bind 0.0.0.0
protected-mode yes
port 6379

# 持久化配置
# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB持久化
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# 内存管理
maxmemory 2gb
maxmemory-policy allkeys-lru

# 日志
loglevel notice

# 密码认证（通过命令行参数设置）
# requirepass emp123456

# 其他配置
timeout 0
tcp-keepalive 300
