# MinIO配置
minio:
  # 是否启用MinIO（设置为true后才会加载MinIO存储策略）
  enabled: true
  # MinIO服务地址（API端口，不是控制台端口，默认9000）
  endpoint: http://172.22.67.71:9000
  # 访问密钥（请根据实际MinIO服务器配置修改）
  # Docker默认: minioadmin
  accessKey: admin
  # 密钥（请根据实际MinIO服务器配置修改）
  # Docker默认: minioadmin
  secretKey: miniopassword
  # 默认存储桶名称
  bucketName: demo

# 文件存储配置
file:
  storage:
    # 默认存储类型：local=本地存储, minio=MinIO存储（可在上传时动态选择）
    type: local
  upload:
    # 文件上传大小限制（字节）
    maxSize: 10485760
    # 允许的文件类型
    allowedTypes: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar
