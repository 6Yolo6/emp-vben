# Bootstrap配置文件 - 用于Nacos配置中心初始化
spring:
  application:
    name: emp-system
  
  cloud:
    nacos:
      # Nacos服务器地址
      server-addr: localhost:8848
      # Nacos用户名
      username: nacos
      # Nacos密码
      password: nacos
      
      # 配置中心配置
      config:
        # 暂时禁用配置中心，避免启动失败
        enabled: false
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
        # 配置刷新
        refresh-enabled: true
        # 配置导入检查（设置为可选，避免启动失败）
        import-check:
          enabled: false
