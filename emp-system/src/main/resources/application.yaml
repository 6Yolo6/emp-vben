# 服务器配置
server:
  port: 8080

# 应用配置
spring:
  application:
    name: emp-system

  profiles:
    active: dev
    include: minio  # 引入MinIO配置

  # 开发工具配置
  devtools:
    restart:
      enabled: true

  # PostgreSQL数据源配置（多数据源）
  datasource:
    # Druid数据源配置
    druid:
      # 主数据源（写库）
      master:
        url: jdbc:postgresql://localhost:5432/emp_dev
        username: postgres
        password: Root@123
        driver-class-name: org.postgresql.Driver
        # 连接池配置
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        time-between-eviction-runs-millis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        min-evictable-idle-time-millis: 300000
        # 验证连接有效性的SQL
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        # 打开PSCache，并且指定每个连接上PSCache的大小
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,wall
        # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
        # 合并多个DruidDataSource的监控数据
        use-global-data-source-stat: true

      # 从数据源（读库）- 暂时使用相同配置，后续可配置为只读副本
      slave:
        url: jdbc:postgresql://localhost:5432/emp_dev_clone
        username: postgres
        password: Root@123
        driver-class-name: org.postgresql.Driver
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
        use-global-data-source-stat: true

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
#      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 默认缓存过期时间（毫秒）
      cache-null-values: true  # 是否缓存空值
      key-prefix: "emp:cache:"  # 缓存key前缀
      use-key-prefix: true

# Redisson配置
redisson:
  # 单机模式
  single-server-config:
    address: "redis://localhost:6379"
#    password:
    database: 0
    connection-pool-size: 64
    connection-minimum-idle-size: 10
    idle-connection-timeout: 10000
    timeout: 3000
    connect-timeout: 10000

  # Nacos配置（暂时禁用，等Docker环境启动后再启用）
  cloud:
    nacos:
      # Nacos服务器地址
      server-addr: localhost:8848
      # Nacos用户名
      username: nacos
      # Nacos密码
      password: nacos

      # 服务发现配置
      discovery:
        enabled: false  # 暂时禁用
        namespace: dev
        group: DEFAULT_GROUP
        service: ${spring.application.name}

      # 配置中心配置
      config:
        enabled: false  # 暂时禁用
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
        # 共享配置
        shared-configs:
          - data-id: application-common.yaml
            group: DEFAULT_GROUP
            refresh: true

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: 180
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从header中读取token
  is-read-header: true
  # token前缀
  token-prefix: "Bearer"

# MyBatis-Flex配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL日志输出
  global-config:
    logic-delete-column: deleted  # 逻辑删除字段
    logic-delete-value: 1  # 逻辑删除值
    logic-normal-value: 0  # 正常值

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    com.ldjt.emp: debug
    com.mybatisflex: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

